<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexNet Elite Pro | Zero-Config React</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        elite: {
                            bg: '#FAF9F6',
                            card: '#FFFFFF',
                            primary: '#8B5CF6'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; }
        .elite-card { border: 1px solid #F1F5F9; transition: all 0.3s ease; }
        .elite-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04); }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton { background: linear-gradient(90deg, #F1F5F9 25%, #F8FAFC 50%, #F1F5F9 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React V3 Pro: Pro-Level ESM Implementation -->
    <script type="module">
        import React from 'https://cdn.skypack.dev/react';
        import ReactDOM from 'https://cdn.skypack.dev/react-dom';
        import htm from 'https://cdn.skypack.dev/htm';
        import { create } from 'https://cdn.skypack.dev/zustand';
        import axios from 'https://cdn.skypack.dev/axios';
        import { motion, AnimatePresence } from 'https://cdn.skypack.dev/framer-motion';

        const html = htm.bind(React.createElement);
        window.React = React;
        window.html = html;
        window.axios = axios;
        window.motion = motion;
        window.AnimatePresence = AnimatePresence;
        window.createStore = create;

        // Load our professional App logic
        import './src/App.js';
    </script>
</body>
</html>
