<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexNet V4 | Guaranteed Launch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel Standalone (The most stable way for zero-config) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .card { background: white; border: 1px solid #E2E8F0; border-radius: 12px; }
        .btn-primary { background: #2563EB; color: white; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .btn-primary:hover { background: #1D4ED8; }
        .input-field { border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px 14px; width: 100%; outline: none; }
        .input-field:focus { border-color: #2563EB; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- API & State ---
        const api = axios.create({ baseURL: 'http://127.0.0.1:5001/api' });
        
        // --- Components ---
        const Navbar = ({ user, onLogout }) => (
            <nav className="fixed top-0 left-0 right-0 bg-white border-b border-slate-200 z-50 h-14 flex items-center">
                <div className="max-w-screen-md mx-auto px-4 w-full flex justify-between items-center">
                    <div className="text-xl font-bold text-blue-600">NexNet</div>
                    <div className="flex gap-4 text-sm font-semibold">
                        <span>@{user.username}</span>
                        <button className="text-red-500" onClick={onLogout}>Çıkış</button>
                    </div>
                </div>
            </nav>
        );

        const PostCard = ({ post }) => (
            <div className="card p-5 mb-6">
                <div className="font-bold text-sm mb-1">@{post.author_username}</div>
                <h3 className="font-bold text-lg mb-2">{post.title}</h3>
                <p className="text-slate-600 text-sm">{post.content}</p>
                <div className="mt-4 pt-4 border-t border-slate-50 text-xs font-bold text-slate-400">
                    {post.likes_count || 0} Beğeni
                </div>
            </div>
        );

        // --- Pages ---
        const LoginPage = ({ onLogin }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await api.post('/login', { username: u, password: p });
                    localStorage.setItem('token', res.data.access_token);
                    onLogin(res.data.user);
                } catch { alert('Giriş başarısız!'); }
            };
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <form className="card p-8 w-full max-w-sm space-y-4" onSubmit={handleSubmit}>
                        <h1 className="text-2xl font-bold text-center">NexNet V4</h1>
                        <input className="input-field" placeholder="Kullanıcı Adı" onChange={e => setU(e.target.value)} />
                        <input className="input-field" type="password" placeholder="Şifre" onChange={e => setP(e.target.value)} />
                        <button className="btn-primary w-full py-3">Giriş Yap</button>
                    </form>
                </div>
            );
        };

        const FeedPage = () => {
            const [posts, setPosts] = useState([]);
            const [loading, setLoading] = useState(true);
            useEffect(() => {
                api.get('/posts/', { headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }})
                   .then(res => { setPosts(res.data); setLoading(false); });
            }, []);
            return (
                <div className="pt-20 px-4 max-w-screen-md mx-auto">
                    {loading ? <div className="text-center py-20">Yükleniyor...</div> : 
                        posts.map(p => <PostCard key={p.id} post={p} />)}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [user, setUser] = useState(JSON.parse(localStorage.getItem('user')));
            const handleLogout = () => { localStorage.clear(); setUser(null); };
            const handleLogin = (u) => { localStorage.setItem('user', JSON.stringify(u)); setUser(u); };

            if (!user) return <LoginPage onLogin={handleLogin} />;
            return (
                <div>
                    <Navbar user={user} onLogout={handleLogout} />
                    <FeedPage />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
